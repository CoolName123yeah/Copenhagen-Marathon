<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard</title>
    <link rel="stylesheet" href="leaderboard.css">
</head>
<body>
    <header class="topbar">
        <h1>Leaderboard</h1>
        <a class="back" href="index.html" aria-label="Back to homepage">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M20 12H5M11 5l-7 7 7 7"/>
            </svg>
        </a>
        <nav class="filters" aria-label="Leaderboard filters">
            <select id="gender" aria-label="Category">
                <option value="all">all</option>
                <option value="women">women</option>
                <option value="men">men</option>
            </select>
            <select id="year" aria-label="Year">
                <option>2026</option><option>2025</option><option>2024</option>
                <option>2023</option><option>2022</option>
            </select>
            <select id="position" aria-label="Order">
                <option value="fastest">fastest</option>
                <option value="slowest">slowest</option>
            </select>
        </nav>
    </header>

    <main>
        <section id="podium" class="podium" aria-label="Top three"></section>
        <ol id="list" class="leaderboard"></ol>
    </main>

    <script src="leaderboard.js"></script>
</body>
</html>
