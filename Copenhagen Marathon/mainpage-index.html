<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copenhagen Marathon</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap">
  <link rel="stylesheet" href="mainpage-style.css">
</head>
<body>
  <svg class="poster" viewBox="0 0 1033 1377">

    <!-- Background: pole, title sign and clock sign -->
    <image href="images/mainpage-background.png" width="1033" height="1377"/>

    <!-- Signs that move. Each one = picture + text.
         matrix() puts the text onto the sign in perspective. -->
    <g class="sign sign-tracking">
      <image href="images/mainpage-tracking.png" width="1033" height="1377"/>
      <text transform="matrix(0.850 0.526 -0.178 0.982 165 280)" x="189" y="44">TRACKING</text>
    </g>

    <g class="sign sign-map">
      <image href="images/mainpage-map.png" width="1033" height="1377"/>
      <text transform="matrix(0.855 0.518 -0.204 0.978 131 413)" x="205" y="44">MAP</text>
    </g>

    <g class="sign sign-leaderboard">
      <image href="images/mainpage-leaderboard.png" width="1033" height="1377"/>
      <text transform="matrix(0.872 0.489 -0.197 0.980 87 560)" x="211" y="45">LEADERBOARD</text>
    </g>

    <!-- Race clock -->
    <text id="clock" transform="matrix(0.991 -0.127 -0.045 0.999 542 940)" x="176" y="110">1:08:23</text>


    <!-- Invisible areas: mouse over them makes the sign move -->
    <polygon id="hit-tracking" class="hit" points="168,280 485,480 475,568 146,368"/>
    <polygon id="hit-map" class="hit" points="133,410 480,630 467,710 110,503"/>
    <polygon id="hit-leaderboard" class="hit" points="90,557 453,770 440,853 67,653"/>

  </svg>
  <script src="mainpage-script.js"></script>
</body>
</html>
