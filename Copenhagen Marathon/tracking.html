    <!-- Overlays (HTML so they keep a constant size on screen while the map zooms) -->
    <div id="viewer" class="viewer" hidden aria-label="Your location">
        <svg class="viewer-cone" viewBox="-60 -110 120 110" aria-hidden="true">
            <defs>
                <radialGradient id="coneGrad" cx="0" cy="0" r="105" gradientUnits="userSpaceOnUse">
                    <stop offset="0" stop-color="#ff8a3d" stop-opacity=".85"/>
                    <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
                </radialGradient>
            </defs>
            <path d="M0,0 L-36,-104 A110,110 0 0 1 36,-104 Z" fill="url(#coneGrad)"/>
        </svg>
        <span class="viewer-dot"></span>
    </div>

    <div id="runnerDot" class="runner-dot" hidden></div>

    <div id="callout" class="callout" hidden>
        <svg class="callout-shape" viewBox="0 0 168 196" preserveAspectRatio="none" aria-hidden="true">
            <path d="M10,10 H158 V134 L84,188 L10,134 Z"/>
        </svg>
        <div class="callout-photo" id="calloutPhoto"></div>
        <div class="callout-name" id="calloutName"></div>
        <div class="callout-stat" id="calloutStat"></div>
    </div>

    <!-- Search -->
    <form class="search" id="searchForm" role="search" autocomplete="off">
        <label class="sr-only" for="bib">Bib number</label>
        <input id="bib" name="bib" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="ENTER BIB">
        <button type="submit" class="search-btn" aria-label="Find runner">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.2"/><path d="M14.6 14.6 21 21"/></svg>
        </button>
    </form>
    <p id="message" class="message" role="status" aria-live="polite" hidden></p>

    <button type="button" id="back" class="round-btn back" aria-label="Clear search" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 5l-7 7 7 7"/></svg>
    </button>

    <!-- Map controls -->
    <div class="controls">
        <button type="button" id="locate" class="ctl" aria-label="Centre on runner">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5.2"/><circle cx="12" cy="12" r="1.6" class="fill"/><path d="M12 2v3.4M12 18.6V22M2 12h3.4M18.6 12H22"/></svg>
        </button>
        <div class="ctl-zoom">
            <button type="button" id="zoomIn" aria-label="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
            <button type="button" id="zoomOut" aria-label="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        </div>
    </div>
