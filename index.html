<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copenhagen Marathon</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <svg class="poster" viewBox="0 0 1033 1377">

    <!-- 1. Dark blue sky -->
    <rect class="sky" width="1033" height="1377"/>

    <!-- 2. "KBH" graffiti (photos/mainpage-graffiti.svg). It gets sprayed stroke by stroke:
         the mask has one thick line for every stroke of the letters, and each line
         draws itself one after another (see index.css). -->
    <defs>
      <filter id="spray-edge" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="3" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="15"/>
      </filter>
      <mask id="spray-mask" maskUnits="userSpaceOnUse" x="40" y="220" width="530" height="330">
        <g filter="url(#spray-edge)">
        <path class="stroke" pathLength="1" style="--start:0.15s; --time:0.20s" d="M116.5 313.8 C115.8 320.7 112.7 340.8 112.7 355.2 C112.7 369.7 114.6 387.9 116.5 400.5 C118.4 413.0 120.9 416.2 124.0 430.6 C127.1 445.1 133.4 477.8 135.3 487.2"/>  <!-- K stem -->
        <path class="stroke" pathLength="1" style="--start:0.38s; --time:0.27s" d="M174.9 278.0 C177.1 283.3 184.3 300.6 188.1 310.0 C191.9 319.4 194.1 328.9 197.5 334.5 C201.0 340.2 206.9 338.0 208.8 343.9 C210.7 349.9 210.4 363.9 208.8 370.3 C207.3 376.7 206.6 379.6 199.4 382.4 C192.2 385.2 178.7 384.3 165.5 387.3 C152.3 390.3 135.0 396.4 120.2 400.5 C105.5 404.6 84.1 409.9 76.9 411.8"/>  <!-- K arm -->
        <path class="stroke" pathLength="1" style="--start:0.68s; --time:0.21s" d="M120.2 401.2 C127.8 403.1 152.3 409.0 165.5 412.5 C178.7 416.1 187.5 418.1 199.4 422.3 C211.3 426.6 226.4 432.7 237.1 438.2 C247.8 443.6 256.3 446.3 263.5 455.1 C270.7 463.9 277.6 485.0 280.4 490.9"/>  <!-- K leg -->
        <path class="stroke" pathLength="1" style="--start:0.92s; --time:0.07s" d="M201.3 461.5 C206.6 461.4 222.3 461.5 233.3 460.8 C244.3 460.0 261.6 457.6 267.3 457.0"/>  <!-- swoosh -->
        <path class="stroke" pathLength="1" style="--start:1.02s; --time:0.20s" d="M252.2 496.6 C254.7 490.0 263.8 469.9 267.3 457.0 C270.7 444.1 272.0 431.3 272.9 419.3 C273.8 407.4 274.5 397.3 272.9 385.4 C271.3 373.5 266.9 358.4 263.5 347.7 C260.0 337.0 254.1 325.7 252.2 321.3"/>  <!-- B stem -->
        <path class="stroke" pathLength="1" style="--start:1.25s; --time:0.21s" d="M252.2 321.3 C253.7 318.7 254.7 309.5 261.6 305.5 C268.5 301.5 283.3 297.8 293.6 297.2 C304.0 296.6 317.8 295.2 323.8 301.7 C329.8 308.2 330.7 324.8 329.4 336.4 C328.2 348.0 325.4 363.4 316.3 371.1 C307.1 378.7 281.7 380.5 274.8 382.4"/>  <!-- B top -->
        <path class="stroke" pathLength="1" style="--start:1.50s; --time:0.28s" d="M274.8 382.4 C281.7 381.0 302.7 375.3 316.3 374.1 C329.8 372.8 345.2 371.7 355.8 374.8 C366.5 378.0 377.5 386.8 380.3 392.9 C383.2 399.1 379.7 404.9 372.8 411.8 C365.9 418.7 350.8 428.1 338.9 434.4 C326.9 440.7 313.4 445.6 301.2 449.5 C288.9 453.4 271.3 456.4 265.4 457.8"/>  <!-- B bottom -->
        <path class="stroke" pathLength="1" style="--start:1.81s; --time:0.21s" d="M393.5 298.7 C394.2 305.0 396.2 323.8 397.3 336.4 C398.4 349.0 398.9 361.5 399.9 374.1 C401.0 386.7 402.1 401.1 403.7 411.8 C405.3 422.5 408.0 425.6 409.7 438.2 C411.5 450.7 413.5 479.0 414.3 487.2"/>  <!-- H left -->
        <path class="stroke" pathLength="1" style="--start:2.04s; --time:0.21s" d="M461.4 296.8 C460.9 303.4 458.1 323.5 458.7 336.4 C459.4 349.3 463.1 363.4 465.2 374.1 C467.2 384.8 468.0 391.1 470.8 400.5 C473.6 409.9 478.2 416.8 482.1 430.6 C486.0 444.5 492.2 474.6 494.2 483.4"/>  <!-- H right -->
        <path class="stroke" pathLength="1" style="--start:2.29s; --time:0.10s" d="M382.2 401.2 C386.3 402.2 397.6 406.9 406.7 407.3 C415.8 407.6 426.2 404.9 436.9 403.1 C447.6 401.4 465.2 397.8 470.8 396.7"/>  <!-- H bar -->
        </g>
        <!-- at the end the paint mist settles and the last bits appear -->
        <rect class="mist" x="40" y="220" width="530" height="330" style="--start:2.42s"/>
        <!-- the "rag": a thick black zigzag that wipes the graffiti away (black in a mask = hidden) -->
        <path class="wipe" pathLength="1" filter="url(#spray-edge)"
              d="M40 250 L570 300 L40 330 L570 380 L40 410 L570 460 L40 490 L570 545"/>
      </mask>
    </defs>
    <g id="graffiti">
      <image href="photos/mainpage-graffiti.svg" width="595.28" height="841.89"
             transform="matrix(3.0971 0 0 3.0971 -384.3 -126.4)" mask="url(#spray-mask)"/>
    </g>

    <!-- 3. Pole, title sign and clock sign -->
    <image href="photos/mainpage-foreground.png" width="1033" height="1377"/>

    <!-- Signs that move. Each one = picture + text.
         matrix() puts the text onto the sign in perspective. -->
    <g class="sign sign-tracking">
      <image href="photos/mainpage-tracking.png" width="1033" height="1377"/>
      <text transform="matrix(0.850 0.526 -0.178 0.982 165 280)" x="189" y="44">TRACKING</text>
    </g>

    <g class="sign sign-map">
      <image href="photos/mainpage-map.png" width="1033" height="1377"/>
      <text transform="matrix(0.855 0.518 -0.204 0.978 131 413)" x="205" y="44">MAP</text>
    </g>

    <g class="sign sign-leaderboard">
      <image href="photos/mainpage-leaderboard.png" width="1033" height="1377"/>
      <text transform="matrix(0.872 0.489 -0.197 0.980 87 560)" x="211" y="45">LEADERBOARD</text>
    </g>

    <!-- Race clock -->
    <text id="clock" transform="matrix(0.991 -0.127 -0.045 0.999 542 940)" x="176" y="110">1:08:23</text>


    <!-- Invisible areas: mouse over them makes the sign move, a click opens the page -->
    <a href="tracking.html"><polygon id="hit-tracking" class="hit" points="168,280 485,480 475,568 146,368"/></a>
    <a href="map-index.html"><polygon id="hit-map" class="hit" points="133,410 480,630 467,710 110,503"/></a>
    <a href="leaderboard.html"><polygon id="hit-leaderboard" class="hit" points="90,557 453,770 440,853 67,653"/></a>

  </svg>
  <script src="index.js"></script>
</body>
</html>
